name: Shell syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate POSIX shell scripts
        shell: sh
        run: |
          set -eu
          find scripts src -type f -exec sh -n {} \;
